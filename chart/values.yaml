vote:
  image: dockersamples/examplevotingapp_vote
  pullPolicy: IfNotPresent
  replicas: 2
  port: 80
  optionA: Cats
  optionB: Dogs
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
result:
  image: dockersamples/examplevotingapp_result
  replicas: 1
  port: 80
worker:
  image: dockersamples/examplevotingapp_worker
  replicas: 1
redis:
  image: redis:alpine
  port: 6379
db:
  image: postgres:15
  port: 5432
  user: postgres
  password: postgres
