apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  labels:
    app: vote
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.vote.replicas }}
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
        - name: vote
          image: {{ .Values.vote.image }}
          imagePullPolicy: {{ .Values.vote.pullPolicy }}
          ports:
            - containerPort: {{ .Values.vote.port }}
          envFrom:
            - configMapRef:
                name: vote-options
          resources:
            requests:
              cpu: {{ .Values.vote.resources.requests.cpu }}
              memory: {{ .Values.vote.resources.requests.memory }}
            limits:
              cpu: {{ .Values.vote.resources.limits.cpu }}
              memory: {{ .Values.vote.resources.limits.memory }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  labels:
    app: result
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.result.replicas }}
  selector:
